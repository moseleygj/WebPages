<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch Counters</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
@font-face {
        font-family: "lcd"; /* Choose a name for your font */
        src: url("digital-7.ttf") format("truetype")}
  body {
    font-family: 'Press Start 2P', cursive;
    background: #0f1724;
    color: #e6eef6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .toggle {
    margin: 10px;
    font-size: 0.8em;
  }

  .timers {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1000px;
  }

  .timer {
    background: #2c3e50;
    border: 3px solid #3498db;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    position: relative;
  }

  .remove-timer {
    position: absolute;
    top: 5px;
    right: 10px;
    cursor: pointer;
    font-size: 1em;
    color: #e74c3c;
  }

  .time-display {
    font-family: 'lcd','Share Tech Mono', monospace;
    background: #b7bfc2;
    color: #0d0d0d;
    padding: 15px 20px;
    font-size: 6.5em;
    border-radius: 12px;
    margin-bottom: 10px;
  }

  .time-inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .timer input[type='number'],
  .name-input {
    width: 60px;
    padding: 8px;
    text-align: center;
    font-size: 0.7em;
    border-radius: 10px;
    border: 1px solid #888;
    background: #f0f0f0;
    font-family: 'Press Start 2P', cursive;
    font-weight: bold;
  }

  .name-input {
    width: 90%;
    margin-top: 8px;
  }

  .controls button {
    margin: 5px;
    padding: 8px 14px;
    border-radius: 5px;
    border: none;
    font-weight: bold;
    font-size: 0.7em;
    background: #e74c3c;
    color: white;
    cursor: pointer;
  }

  #addTimerBtn {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 0.8em;
    border-radius: 10px;
    border: none;
    background: #e67e22;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="toggle">
  <label><input type="radio" name="mode" value="up" checked> Count Up</label>
  <label><input type="radio" name="mode" value="down"> Count Down</label>
</div>
<div class="timers" id="timersContainer"></div>
<button id="addTimerBtn">Add Timer</button>

<script>
const timersContainer = document.getElementById('timersContainer');
let timers = [];

function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}


function beep() {
  const audio = new Audio('alarm.mp3'); // path to your file
  audio.play();
}
function createTimer(index) {
  const timerDiv = document.createElement('div');
  timerDiv.className = 'timer';

  const removeBtn = document.createElement('span');
  removeBtn.className = 'remove-timer';
  removeBtn.textContent = '-';
  removeBtn.addEventListener('click', () => {
    timersContainer.removeChild(timerDiv);
    timers.splice(index, 1);
  });

  const timeDisplay = document.createElement('div');
  timeDisplay.className = 'time-display';
  timeDisplay.textContent = '00:00';

  const timeInputsDiv = document.createElement('div');
  timeInputsDiv.className = 'time-inputs';

  const minInput = document.createElement('input');
  minInput.type = 'number';
  minInput.placeholder = 'Min';
  minInput.min = 0;

  const secInput = document.createElement('input');
  secInput.type = 'number';
  secInput.placeholder = 'Sec';
  secInput.min = 0;
  secInput.max = 59;

  timeInputsDiv.appendChild(minInput);
  timeInputsDiv.appendChild(secInput);

  const controls = document.createElement('div');
  controls.className = 'controls';

  const startStopBtn = document.createElement('button');
  startStopBtn.textContent = 'Start';
  const resetBtn = document.createElement('button');
  resetBtn.textContent = 'R';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = 'Name';
  nameInput.className = 'name-input';

  let interval = null;
  let timeInSeconds = 0;

  function updateDisplay() {
    const min = Math.floor(timeInSeconds / 60).toString().padStart(2,'0');
    const sec = (timeInSeconds % 60).toString().padStart(2,'0');
    timeDisplay.textContent = `${min}:${sec}`;
  }

  startStopBtn.addEventListener('click', () => {
    if (interval) {
      clearInterval(interval);
      interval = null;
      startStopBtn.textContent = 'Start';
      return;
    }

    const mode = getMode();
    const targetSeconds = parseInt(minInput.value || 0) * 60 + parseInt(secInput.value || 0);

    if (mode === 'down') {
      timeInSeconds = targetSeconds;
    } else {
      timeInSeconds = 0;
    }

    updateDisplay();
    startStopBtn.textContent = 'Stop';

    interval = setInterval(() => {
  if (mode === 'down') {
    if (timeInSeconds > 0) {
      timeInSeconds--;
      updateDisplay();
    } else {
      clearInterval(interval);
      interval = null;
      startStopBtn.textContent = 'Start';
      beep(); // <--- sound added here
    }
  } else {
    if (timeInSeconds < targetSeconds) {
      timeInSeconds++;
      updateDisplay();
    } else {
      clearInterval(interval);
      interval = null;
      startStopBtn.textContent = 'Start';
      beep(); // <--- and here for count up
    }
  }
}, 1000);
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(interval);
    interval = null;
    timeInSeconds = 0;
    updateDisplay();
    startStopBtn.textContent = 'Start';
  });

  controls.appendChild(startStopBtn);
  controls.appendChild(resetBtn);

  timerDiv.appendChild(removeBtn);
  timerDiv.appendChild(timeDisplay);
  timerDiv.appendChild(timeInputsDiv);
  timerDiv.appendChild(controls);
  timerDiv.appendChild(nameInput);
  timersContainer.appendChild(timerDiv);

  timers.push({
    display: timeDisplay,
    minInput,
    secInput,
    nameInput,
    updateDisplay,
    get interval() { return interval; },
    set interval(val) { interval = val; },
    get timeInSeconds() { return timeInSeconds; },
    set timeInSeconds(val) { timeInSeconds = val; }
  });
}

for (let i = 0; i < 3; i++) {
  createTimer(i);
}

const addTimerBtn = document.getElementById('addTimerBtn');
addTimerBtn.addEventListener('click', () => {
  createTimer(timers.length);
});
</script>
</body>
</html>
