<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <title>EMOM Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .overall-progress {
      width: 100%;
      height: 30px;
      background-color: #444;
      border-radius: 15px;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }
    #overallBar {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      transition: width 0.5s linear;
    }
    .container {
      padding: 60px 20px 20px 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    canvas {
      display: block;
      margin: 40px auto;
      width: 350px;
      height: 350px;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      gap: 8px;
    }
    .input-group label {
      color: white;
      font-weight: bold;
      font-size: 1.1em;
      user-select: none;
    }
    .controls input[type=number] {
      width: 80px;
      font-size: 1.2em;
      padding: 5px;
      text-align: center;
      border-radius: 8px;
      border: none;
    }
    .controls button {
      font-size: 1.3em;
      padding: 10px 20px;
      margin: 8px 0;
      width: 180px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: white;
      user-select: none;
    }
    #startStopBtn {
      background-color: #4caf50;
    }
    #startStopBtn.stop {
      background-color: #f44336;
    }
    #pauseBtn {
      background-color: #ff9800;
    }
    #pauseBtn:disabled {
      background-color: #777;
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="overall-progress" aria-label="Overall progress bar">
    <div id="overallBar"></div>
  </div>

  <div class="container" role="main">
    <canvas id="currentGauge" width="350" height="350" aria-label="Current set progress gauge"></canvas>

    <div class="controls">
      <div class="input-group">
        <label for="roundsInput">SETS</label>
        <input type="number" id="roundsInput" min="1" max="99" value="5" aria-live="polite" aria-atomic="true" />
      </div>
      <button id="startStopBtn" aria-pressed="false" aria-label="Start or Stop Timer">START</button>
      <button id="pauseBtn" disabled aria-pressed="false" aria-label="Pause or Resume Timer">PAUSE</button>
    </div>
  </div>

<script>
  const roundTime = 60; // seconds per round
  let totalRounds = 5;
  let currentRound = 0;
  let timeLeft = roundTime;
  let running = false;
  let paused = false;
  let timer;

  const canvas = document.getElementById("currentGauge");
  const ctx = canvas.getContext("2d");

  const overallBar = document.getElementById("overallBar");
  const roundsInput = document.getElementById("roundsInput");
  const startStopBtn = document.getElementById("startStopBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  function drawGauge(percent) {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 140;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background circle (gray)
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.fillStyle = "#333";
    ctx.fill();

    // Progress arc (green)
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.fillStyle = "#4caf50";
    ctx.arc(centerX, centerY, radius, -Math.PI/2, (2 * Math.PI * percent) - Math.PI/2, false);
    ctx.lineTo(centerX, centerY);
    ctx.fill();

    // Inner circle (black)
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius - 35, 0, 2 * Math.PI);
    ctx.fillStyle = "#000";
    ctx.fill();

    // Text
    ctx.fillStyle = "#fff";
    ctx.font = "bold 60px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`${Math.round(percent * 100)}%`, centerX, centerY);
  }

  function updateOverallProgressBar(percent) {
    overallBar.style.width = (percent * 100) + "%";
  }

  function playBeep(freq = 1000, duration = 150) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.type = 'sine';
      oscillator.frequency.value = freq;
      oscillator.start();

      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);

      oscillator.stop(audioCtx.currentTime + duration / 1000);
    } catch (e) {
      console.warn("Audio not supported", e);
    }
  }

  function tick() {
    if (!paused && running) {
      timeLeft--;
      if (timeLeft < 0) {
        currentRound++;
        if (currentRound >= totalRounds) {
          playBeep(800, 500); // distinct beep at end of workout
          stopTimer();
          return;
        } else {
          playBeep(600, 300); // beep at end of round
        }
        timeLeft = roundTime;
      }

      // Optional: beep countdown last 3 seconds
      if (timeLeft > 0 && timeLeft <= 3) {
        playBeep(1000, 100);
      }

      let roundProgress = (roundTime - timeLeft) / roundTime;
      drawGauge(roundProgress);

      let overallProgress = (currentRound + roundProgress) / totalRounds;
      updateOverallProgressBar(overallProgress);
    }
  }

  function startTimer() {
    totalRounds = parseInt(roundsInput.value) || 1;
    if (totalRounds < 1) totalRounds = 1;
    currentRound = 0;
    timeLeft = roundTime;
    running = true;
    paused = false;
    drawGauge(0);
    updateOverallProgressBar(0);

    startStopBtn.textContent = "Stop";
    startStopBtn.classList.add("stop");
    startStopBtn.setAttribute("aria-pressed", "true");

    pauseBtn.disabled = false;
    pauseBtn.textContent = "Pause";
    pauseBtn.setAttribute("aria-pressed", "false");

    timer = setInterval(tick, 1000);
  }

  function stopTimer() {
    clearInterval(timer);
    running = false;
    paused = false;
    currentRound = 0;
    timeLeft = roundTime;
    drawGauge(0);
    updateOverallProgressBar(0);

    startStopBtn.textContent = "Start";
    startStopBtn.classList.remove("stop");
    startStopBtn.setAttribute("aria-pressed", "false");

    pauseBtn.disabled = true;
    pauseBtn.textContent = "Pause";
    pauseBtn.setAttribute("aria-pressed", "false");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? "RESUME" : "⏸PAUSE";
    pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
  }

  startStopBtn.addEventListener("click", () => {
    if (!running) {
      startTimer();
    } else {
      stopTimer();
    }
  });

  pauseBtn.addEventListener("click", togglePause);

  // Initial draw
  drawGauge(0);
  updateOverallProgressBar(0);
</script>

</body>
</html>
